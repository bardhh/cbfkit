[project]
name = "cbfkit"
dynamic = ["version"]
description = "A Control Barrier Function Toolbox for Robotics Applications"
authors = [
    {name = "Mitchell Black", email = "6lack.mitchell@gmail.com"},
    {name = "Bardh Hoxha", email = "bardhh@gmail.com"},
    {name = "Hardik Parwana", email = "parwanahardik@gmail.com"},
    {name = "Georgios Fainekos"},
    {name = "Hideki Okamoto"}
]
license = "BSD-3-Clause"
keywords = [
    "control-barrier-functions",
    "safe-control",
    "safe-reinforcement-learning",
    "robotics",
    "jax",
    "optimal-control",
    "model-predictive-control",
    "autonomous-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jax>=0.4.23",
    "jaxopt>=0.8.3,<0.9",
    "rich>=13.0,<15.0",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "matplotlib>=3.8.2,<4.0",
    "jinja2>=3.0.0",
    "scipy>=1.9,<2.0",
]


[project.scripts]
cbfkit-bench = "cbfkit.cli.bench:main"
[project.urls]
Homepage = "https://github.com/bardhh/cbfkit"
Repository = "https://github.com/bardhh/cbfkit"
Documentation = "https://github.com/bardhh/cbfkit#readme"
Issues = "https://github.com/bardhh/cbfkit/issues"
Changelog = "https://github.com/bardhh/cbfkit/releases"
"Paper (arXiv)" = "https://arxiv.org/abs/2404.07158"

[project.optional-dependencies]
# --- Single-purpose extras ---
manim = ["manim>=0.18,<1.0"]
optuna = ["optuna>=3.0"]
neural = ["flax>=0.8", "optax>=0.2"]
gymnasium = ["gymnasium>=1.0"]
torch = ["torch>=2.8", "jax>=0.6.2"]
plotly = ["plotly>=5.18,<7.0"]
casadi = ["casadi>=3.6.4,<4.0"]
cvxopt = [
    "cvxopt>=1.3.2,<2.0; platform_machine != 'aarch64' and platform_machine != 'arm64'",
    "kvxopt>=1.3.2.0,<2.0; platform_machine == 'aarch64' or platform_machine == 'arm64'",
]
# Black formats the code emitted by the codegen pipeline (run_black in
# codegen/create_new_system/generate_model.py). jinja2 itself is a core dep,
# so code generation works out of the box; this extra only adds the formatter.
codegen = ["black>=23.12.1,<27.0"]
# MuJoCo/MJX plant backend. mujoco and mujoco-mjx MUST be pinned to the same
# version: mjx does not upper-bound mujoco and a skew crashes at import.
mujoco = ["mujoco==3.11.0", "mujoco-mjx==3.11.0"]

# --- Convenience umbrella extras ---
solvers = ["cbfkit[casadi]", "cbfkit[cvxopt]"]
vis = ["cbfkit[plotly]"]
# General-purpose extras. Excludes `manim` (ffmpeg/LaTeX required) and the
# explicitly selected `torch` bridge (large, platform-specific runtime).
all = [
    "cbfkit[optuna]",
    "cbfkit[neural]",
    "cbfkit[gymnasium]",
    "cbfkit[plotly]",
    "cbfkit[casadi]",
    "cbfkit[cvxopt]",
    "cbfkit[codegen]",
]

dev = [
    "cbfkit[all]",
    "pytest>=8.0.2",
    "pytest-cov",
    "python-dotenv>=1.2.1",
    "mypy>=1.8.0,<3.0",
    "jupyter>=1.0.0,<2.0",
    "ruff>=0.3.4",
    "black>=23.12.1,<27.0",
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["setuptools>=69.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "src/cbfkit/VERSION"}

[tool.setuptools.package-data]
"cbfkit" = [
    "codegen/templates/*.j2",
    "py.typed",
    "VERSION",
    "systems/mujoco/models/**/*.xml",
    "systems/mujoco/models/**/*.json",
    "systems/mujoco/models/**/NOTICE",
    "systems/mujoco/models/**/LICENSE",
    "systems/mujoco/models/**/README.md",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["D", "D104", "D401", "F401", "E402", "D205", "D209","E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
