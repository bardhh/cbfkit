repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # README showcase recordings are the intentional large source assets.
        exclude: ^media/showcase/(warehouse-safety|g1_[a-z_]+)\.gif$

  # Run the exact same pinned tools and source scope as CI. Run uv sync --locked --extra dev first.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --no-sync black --check src/cbfkit
        language: system
        pass_filenames: false
        files: ^(src/cbfkit/|pyproject.toml)
      - id: isort
        name: isort
        entry: uv run --no-sync isort --check-only src/cbfkit
        language: system
        pass_filenames: false
        files: ^(src/cbfkit/|pyproject.toml)
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check src/cbfkit scripts tests/test_optimization tests/test_benchmarks
        language: system
        pass_filenames: false
        files: ^(src/cbfkit/|scripts/|tests/test_optimization/|tests/test_benchmarks/|pyproject.toml)
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src/cbfkit
        language: system
        pass_filenames: false
        files: ^(src/cbfkit/|mypy.ini|pyproject.toml)
